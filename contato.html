<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Contato - Peter Parker</title>
</head>

<body>

    <header>
        <h1>Entre em Contato</h1>
    </header>

    <main>

        <form>

            <fieldset>

                <legend>Formulário de Contato</legend>

                <p>
                    <label for="nome">
                        Nome:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required>
                </p>


                <p>
                    <label for="email">
                        E-mail:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>
                </p>


                <p>
                    <label for="telefone">
                        Telefone:
                    </label>

                    <br>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(91) 99999-9999"
                        required>
                </p>


                <p>

                    Você é recrutador?

                    <br>

                    <input
                        type="radio"
                        id="sim"
                        name="recrutador"
                        value="sim">

                    <label for="sim">
                        Sim
                    </label>

                    <br>

                    <input
                        type="radio"
                        id="nao"
                        name="recrutador"
                        value="nao">

                    <label for="nao">
                        Não
                    </label>

                </p>


                <p>

                    <label for="mensagem">
                        Mensagem:
                    </label>

                    <br>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="8"
                        cols="40"
                        maxlength="500"
                        placeholder="Digite sua mensagem"></textarea>

                </p>


                <p>

                    <button type="submit">
                        Enviar
                    </button>

                </p>

            </fieldset>

        </form>

        <br>

        <a href="index.html">
            Voltar para a página principal
        </a>

    </main>

</body>

</html>
